{% extends 'base.html' %}

{% block content %}
<div class="fade-in"
    style="max-width: 600px; margin: 50px auto; text-align: center; border: 2px solid var(--sos); border-radius: 24px; padding: 40px; background: rgba(255, 92, 92, 0.05);">
    <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: var(--sos); margin-bottom: 20px;"></i>
    <h1 style="color: var(--sos); margin-bottom: 20px;">Emergency Help</h1>

    <p style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px;">
        You are not alone. If you are in immediate danger or need urgent support, please contact these helplines
        immediately.
    </p>

    <div class="card" style="margin-bottom: 20px; border-left: 5px solid var(--sos);">
        <h3>Kiran Helpline (Govt of India)</h3>
        <p style="font-size: 1.5rem; font-weight: bold; margin: 10px 0;">1800-599-0019</p>
        <p style="color: var(--text-grey); font-size: 0.9rem;">24/7 Mental Health Rehabilitation</p>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 30px; justify-content: center;">
        <button class="btn" style="background: var(--sos); font-size: 1.2rem; cursor: pointer;">
            <i class="fas fa-phone"></i> Call Now
        </button>
        <a href="{{ url_for('dashboard') }}" class="btn"
            style="background: var(--bg-dark); border: 1px solid var(--border);">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
